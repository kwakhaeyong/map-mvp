name: Guarded Auto Merge

on:
  workflow_run:
    workflows: ["MAP Quality Gate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty')
          test -n "$PR"
          echo "number=$PR" >> "$GITHUB_OUTPUT"
      - name: Skip merge for Draft pull requests
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          IS_DRAFT=$(gh api "repos/$REPO/pulls/$PR" --jq '.draft')
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::notice title=Auto-merge skipped::PR #$PR is still a Draft — Quality Gate passed, but auto-merge is skipped until it's marked Ready for review."
          fi
      - name: Merge after Quality Gate success
        if: steps.draft.outputs.is_draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
