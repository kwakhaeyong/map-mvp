name: Daily Generation Limit Alert

# n8n Cloud 무료 체험 종료(실행 횟수 소진)에 따라 이 체크를 GitHub Actions로
# 옮긴다. src/map-decision-v1/engine/rate-limit.ts가 Upstash Redis에 쓰는
# "서비스 전체 하루 생성 횟수" 카운터(키: gen-slot:global:<KST 날짜>,
# KST 자정 기준)를 읽기 전용 토큰으로 조회해서 경고 기준을 넘었는지만
# 확인한다 — 이 워크플로는 제품 코드를 전혀 건드리지 않는다.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # 상한값을 소스에서 읽어오려면(아래 GLOBAL_LIMIT) 저장소 파일이
      # 필요하다 — 이전에는 이 워크플로가 저장소를 체크아웃하지 않고
      # curl만 실행했다.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check daily global generation counter
        env:
          UPSTASH_REST_URL: ${{ secrets.UPSTASH_REST_URL }}
          UPSTASH_READONLY_TOKEN: ${{ secrets.UPSTASH_READONLY_TOKEN }}
          # ★Vercel에서 DAILY_GLOBAL_GENERATION_LIMIT 환경변수로 코드
          # 기본값(300)을 오버라이드했다면, 이 저장소 Variable(Settings →
          # Secrets and variables → Actions → Variables 탭, 이름은 앱의
          # 환경변수와 똑같이 DAILY_GLOBAL_GENERATION_LIMIT)에 같은 숫자를
          # 등록해두면 이 워크플로가 grep 대신 그 값을 우선 사용한다.
          # 오버라이드가 없다면 등록하지 않아도 되고, 그러면 지금처럼
          # 코드 기본값을 grep으로 읽는다. secret이 아니라 variable인
          # 이유: 이 숫자는 비밀이 아니고, secret은 워크플로 로그에
          # 출력하면 자동으로 마스킹돼(***) 로그를 봐도 뭘 쓰고 있는지
          # 확인할 수 없기 때문이다.
          DAILY_LIMIT_VAR: ${{ vars.DAILY_GLOBAL_GENERATION_LIMIT }}
        run: |
          set -e
          if [ -z "$UPSTASH_REST_URL" ] || [ -z "$UPSTASH_READONLY_TOKEN" ]; then
            echo "UPSTASH_REST_URL 또는 UPSTASH_READONLY_TOKEN이 아직 설정되지 않았습니다. 건너뜁니다."
            exit 0
          fi

          # ★경고 기준을 고정 숫자(예전 70) 대신 상한(GLOBAL_LIMIT)의 70%로
          # 계산한다 — 예전엔 오너가 상한을 100으로 알고 70을 정했는데,
          # 실제 코드 기본값은 300이라 70은 23% 지점에 불과했다(매일
          # 아침에 알림이 울려서 무시하게 되는 문제).
          #
          # 상한 값의 출처는 두 곳 중 하나다 — 순서대로 확인한다:
          # 1) DAILY_LIMIT_VAR(저장소 Variable) — Vercel 쪽 오버라이드와
          #    반드시 같은 값으로 오너가 직접 맞춰둔 값. 있으면 이 값을
          #    무조건 우선한다(코드 기본값보다 신뢰도가 높다 — 실제
          #    운영 중인 값을 오너가 직접 확인해서 넣은 것이므로).
          # 2) rate-limit.ts의 DEFAULT_DAILY_GLOBAL_GENERATION_LIMIT
          #    상수를 grep으로 읽은 값 — Variable을 등록하지 않았다면
          #    (=Vercel 오버라이드가 없다는 뜻) 이 기본값이 곧 실제
          #    운영 상한과 같다.
          # ★grep이 깨지면(상수 이름이 바뀌는 등) 조용히 넘어가지 않고
          # 워크플로 자체를 실패시킨다 — 잘못된 임계값으로 계속 도는
          # 것보다 "지금 확인이 안 된다"는 신호가 낫다.
          if [ -n "$DAILY_LIMIT_VAR" ]; then
            if ! [[ "$DAILY_LIMIT_VAR" =~ ^[0-9]+$ ]]; then
              echo "::error::저장소 Variable DAILY_GLOBAL_GENERATION_LIMIT 값('${DAILY_LIMIT_VAR}')이 숫자가 아닙니다."
              exit 1
            fi
            GLOBAL_LIMIT="$DAILY_LIMIT_VAR"
            LIMIT_SOURCE="GitHub Variable(DAILY_GLOBAL_GENERATION_LIMIT)"
          else
            GLOBAL_LIMIT=$(grep -oP 'DEFAULT_DAILY_GLOBAL_GENERATION_LIMIT = \K[0-9]+' src/map-decision-v1/engine/rate-limit.ts)
            if [ -z "$GLOBAL_LIMIT" ]; then
              echo "::error::rate-limit.ts에서 DEFAULT_DAILY_GLOBAL_GENERATION_LIMIT 상수를 못 찾았습니다 — 이름이 바뀌었으면 위 grep 패턴도 같이 고쳐야 합니다. (저장소 Variable DAILY_GLOBAL_GENERATION_LIMIT을 등록해두면 이 grep 실패와 무관하게 계속 동작합니다.)"
              exit 1
            fi
            LIMIT_SOURCE="rate-limit.ts 기본값(grep, Variable 미등록)"
          fi
          ALERT_THRESHOLD=$(( GLOBAL_LIMIT * 70 / 100 ))

          KST_DATE=$(TZ='Asia/Seoul' date +%F)
          KEY="gen-slot:global:${KST_DATE}"

          RESPONSE=$(curl -s --max-time 10 "${UPSTASH_REST_URL}/get/${KEY}" \
            -H "Authorization: Bearer ${UPSTASH_READONLY_TOKEN}")
          VALUE=$(echo "$RESPONSE" | jq -r '.result // "0"')

          if ! [[ "$VALUE" =~ ^[0-9]+$ ]]; then
            echo "예상치 못한 응답이라 값을 숫자로 읽을 수 없습니다."
            exit 1
          fi

          echo "오늘(KST ${KST_DATE}) 전체 생성 카운터: ${VALUE} / 경고 기준 ${ALERT_THRESHOLD}(상한 ${GLOBAL_LIMIT}의 70%) / 상한 ${GLOBAL_LIMIT} / 상한 출처: ${LIMIT_SOURCE}"

          if [ "$VALUE" -ge "$ALERT_THRESHOLD" ]; then
            echo "::error::전체 생성 카운터(${VALUE})가 경고 기준(${ALERT_THRESHOLD}, 상한 ${GLOBAL_LIMIT}의 70%, 출처: ${LIMIT_SOURCE}) 이상입니다."
            exit 1
          fi
